<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maldito Vicio | Carta VIP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101013;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 12px;background:#19191d;border-bottom:2px solid #b99550}
h1{color:#e5bf76;letter-spacing:2px;margin:0;font-size:27px}
header p{color:#d8c9a6;margin:9px 0 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;position:sticky;top:0;background:#101013;z-index:2}
button{border:1px solid #a88749;background:#29251e;color:#f5d99c;padding:11px;border-radius:10px;white-space:nowrap;font-weight:bold}
button.activo{background:#c6a15b;color:#161616}
main{max-width:850px;margin:auto;padding:12px}
h2{color:#e5bf76;text-align:center}
#productos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.producto{background:#222126;border:1px solid #9e7d43;border-radius:15px;padding:10px;min-width:0;text-align:center}
.foto{height:150px;background:#343038;border-radius:10px;display:grid;place-items:center;font-size:55px;margin-bottom:10px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:contain}
.nombre{font-weight:bold;font-size:14px;min-height:36px;overflow-wrap:anywhere}
.precio{font-weight:bold;font-size:22px;color:#e5bf76;margin-top:8px}
footer{text-align:center;color:#b5a587;padding:25px}
@media(min-width:700px){.foto{height:220px}.nombre{font-size:18px}}
</style>
</head>
<body>
<header><h1>MALDITO VICIO</h1><p>✦ CARTA VIP ✦</p></header>
<nav id="menu"></nav>
<main><h2 id="titulo">Botellas</h2><div id="productos">Cargando carta...</div></main>
<footer>Maldito Vicio · Carta VIP</footer>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQRIZn_Hjo67Ns3DpvGQPnyC2HU25BicCoSe6o9DqhOa4yU2QJ7fQXI8zsOjX91CRZwAm9Q0dNC2N8b/pub?gid=0&single=true&output=csv";
const categorias=["Botellas","Promos","Tragos","Sin alcohol","Kiosco","Merchandising"];
let datos=[];
function leerCSV(s){let filas=[],fila=[],campo="",comillas=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(comillas&&s[i+1]==='"'){campo+='"';i++}else comillas=!comillas}else if(c===','&&!comillas){fila.push(campo);campo=""}else if((c==='\n'||c==='\r')&&!comillas){if(c==='\r'&&s[i+1]==='\n')i++;fila.push(campo);if(fila.some(x=>x.trim()))filas.push(fila);fila=[];campo=""}else campo+=c}fila.push(campo);if(fila.some(x=>x.trim()))filas.push(fila);return filas}
function mostrar(cat){
document.getElementById("titulo").textContent=cat;
const menu=document.getElementById("menu");menu.replaceChildren();
categorias.forEach(c=>{let b=document.createElement("button");b.textContent=c;b.className=c===cat?"activo":"";b.onclick=()=>mostrar(c);menu.appendChild(b)});
let zona=document.getElementById("productos");zona.replaceChildren();
let items=datos.filter(x=>x[0].trim().toLowerCase()===cat.toLowerCase());
if(!items.length){zona.textContent="No hay productos disponibles en esta categoría.";return}
items.forEach(x=>{
let card=document.createElement("div");card.className="producto";
let foto=document.createElement("div");foto.className="foto";
foto.textContent=cat==="Botellas"?"🍾":cat==="Promos"?"🥂":cat==="Tragos"?"🍹":cat==="Sin alcohol"?"🥤":cat==="Kiosco"?"🍬":"🛍️";
let info=document.createElement("div");
let nombre=document.createElement("div");nombre.className="nombre";nombre.textContent=x[1];
let precio=document.createElement("div");precio.className="precio";
let n=Number(String(x[2]).replace(/[^0-9]/g,""));precio.textContent=n?"$"+n.toLocaleString("es-AR"):"Consultar";
info.append(nombre,precio);card.append(foto,info);zona.appendChild(card)
})
}
fetch(CSV).then(r=>{if(!r.ok)throw Error("No se pudo cargar");return r.text()}).then(t=>{datos=leerCSV(t).slice(1).filter(x=>x.length>=3);mostrar("Botellas")}).catch(()=>{document.getElementById("productos").textContent="No se pudieron cargar los precios. Intentá nuevamente más tarde."});
</script>
</body>
</html>
